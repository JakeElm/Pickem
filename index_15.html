<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Football Pick Em</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a4fc4;
  --blue-dark:#1240a0;
  --blue-light:#2a60e0;
  --navy:#0d1b3e;
  --navy2:#152454;
  --navy3:#1c2e6a;
  --bg-base:#f4f6fb;
  --bg-card:#ffffff;
  --bg-card2:#eef1f8;
  --bg-card3:#dde3f4;
  --border:#c5cfe8;
  --text:#0d1b3e;
  --text-muted:#5566aa;
  --green:#16a34a;
  --green-dark:#dcfce7;
  --wrong:#dc2626;
  --wrong-dark:#fee2e2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg-base);color:var(--text);min-height:100vh}

/* TOPBAR — scorebug style */
.topbar{background:var(--navy);border-bottom:3px solid var(--blue-light);padding:0;height:58px;display:flex;align-items:stretch}
.topbar-badge{background:var(--blue);padding:0 22px;display:flex;align-items:center;clip-path:none;border-radius:0 8px 8px 0;margin-right:4px}
.topbar-badge span{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.topbar-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;padding:0 20px}

.container{max-width:1120px;margin:0 auto;padding:20px 16px}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:2px solid var(--border);background:#ffffff;border-radius:10px 10px 0 0;overflow:hidden}
.tab{padding:12px 28px;border:none;background:transparent;color:var(--text-muted);font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);background:var(--bg-card2)}
.section{display:none}.section.active{display:block}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card-title{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--navy);margin-bottom:1rem;padding-bottom:8px;border-bottom:2px solid var(--blue-light);display:flex;align-items:center;gap:8px}
.card-title::before{content:'';display:inline-block;width:3px;height:14px;background:var(--blue-light);border-radius:1px}

label{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg-card2);color:var(--text);font-family:'Source Sans 3',sans-serif}
input:focus,select:focus{outline:none;border-color:var(--blue-light);box-shadow:0 0 0 2px rgba(42,96,224,.2)}
select option{background:var(--bg-card2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}

.btn-primary{background:var(--blue);color:#fff;border:none;padding:10px 22px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.8px}
.btn-primary:hover{background:var(--blue-light)}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border);padding:10px 22px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.8px}
.btn-secondary:hover{background:var(--bg-card2)}
.btn-danger{background:transparent;color:var(--wrong);border:1px solid #5a2020;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'Source Sans 3',sans-serif}
.btn-danger:hover{background:var(--wrong-dark)}
.btn-sm{padding:6px 14px;font-size:12px}
.err{color:var(--wrong);font-size:13px;margin-top:8px}
.success-msg{font-size:13px;margin-top:8px}
.empty{color:var(--text-muted);font-size:14px;padding:.5rem 0}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}

/* PIN gate */
.pin-gate{background:var(--bg-card2);border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin-bottom:1rem;text-align:center}
.pin-gate p{font-size:14px;color:var(--text-muted);margin-bottom:1rem}
.pin-row{display:flex;gap:8px;justify-content:center;max-width:280px;margin:0 auto}
.pin-row input{flex:1;text-align:center;font-size:20px;letter-spacing:6px;font-family:'Oswald',sans-serif;padding:10px}
.pin-err{color:var(--wrong);font-size:13px;margin-top:8px}

/* Game cards — scorebug style */
.game-card{background:var(--bg-card2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.game-card-day{background:var(--blue);padding:5px 14px;font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#fff;border-radius:12px 12px 0 0}
.game-card-body{display:flex;align-items:stretch;min-height:68px}
.team-block{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 16px;background:#ffffff}
.team-block.away{border-right:1px solid var(--border)}
.team-name-big{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);line-height:1}
.at-divider{display:flex;align-items:center;justify-content:center;padding:0 10px;background:var(--blue);min-width:38px}
.at-text{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px}
.game-info-block{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:10px 16px;border-left:1px solid var(--border);min-width:110px;background:var(--blue)}
.game-time-big{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:#ffffff;line-height:1}
.game-tv-line{font-family:'Oswald',sans-serif;font-size:11px;color:#7b8ccc;letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.game-pick-row{display:flex;gap:0;border-top:1px solid var(--border);overflow:hidden}
.pick-btn{flex:1;padding:11px 8px;border:none;border-right:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:700;background:var(--bg-card2);color:var(--text-muted);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;text-align:center;transition:background .1s,color .1s}
.pick-btn:first-child{border-radius:0 0 0 12px}
.pick-btn:last-child{border-right:none;border-radius:0 0 12px 0}
.pick-btn:hover:not(:disabled){background:var(--blue-dark);color:#fff}
.pick-btn.selected{background:var(--blue);color:#fff}
.pick-btn.correct{background:#dcfce7;color:#15803d}
.pick-btn.wrong{background:#fee2e2;color:#dc2626}
.pick-btn:disabled{opacity:.5;cursor:default}

.leaderboard-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:12px}
.leaderboard-row:last-child{border-bottom:none}
.rank{font-size:13px;color:var(--text-muted);width:28px;font-family:'Oswald',sans-serif;font-weight:700}
.lname{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.lscore{font-size:18px;color:var(--blue);font-weight:700;font-family:'Oswald',sans-serif}

.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-family:'Oswald',sans-serif}
.badge-success{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.badge-warning{background:#3d2d0a;color:#e0a030;border:1px solid #6a4e10}
.badge-neutral{background:var(--bg-card2);color:var(--text-muted);border:1px solid var(--border)}

.breakdown-table{width:100%;border-collapse:collapse;font-size:13px}
.breakdown-table th{text-align:center;padding:8px 6px;border-bottom:2px solid var(--blue-light);color:var(--text-muted);font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;min-width:80px}
.breakdown-table th:first-child{text-align:left;padding-left:0}
.breakdown-table td{text-align:center;padding:8px 6px;border-bottom:1px solid var(--border);color:var(--text);font-size:13px}
.breakdown-table td:first-child{text-align:left;padding-left:0;font-weight:600;white-space:nowrap}
.breakdown-table tr:last-child td{border-bottom:none}
.cell-correct{background:#dcfce7;color:#15803d}
.cell-wrong{background:#fee2e2;color:#dc2626}
.cell-none{color:var(--text-muted)}

.game-input-card{background:var(--bg-card2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.game-input-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.game-num{font-size:13px;font-weight:700;color:var(--blue-light);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px}
/* Row-style pick buttons (matches Enter Results layout) */
.pick-btn-row{padding:7px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;background:var(--bg-card2);color:var(--text-muted);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;transition:background .1s,color .1s,border-color .1s}
.pick-btn-row:hover:not(:disabled){background:var(--blue-dark);color:#fff;border-color:var(--blue-dark)}
.pick-btn-row.selected{background:var(--blue);color:#fff;border-color:var(--blue)}
.pick-btn-row.correct{background:#dcfce7;color:#15803d;border-color:#86efac}
.pick-btn-row.wrong{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.pick-btn-row:disabled{opacity:.5;cursor:default}
.game-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.game-input-grid-bottom{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.pw-gate{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1rem;gap:1rem}
.pw-gate p{font-size:14px;color:var(--text-muted)}
.pw-row{display:flex;gap:8px;width:100%;max-width:320px}
.pw-row input{flex:1}
.pw-err{color:var(--wrong);font-size:13px}
.admin-unlocked{display:none}
.home-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.sticky-col{position:sticky;top:20px}
.lb-week-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.lb-week-row label{margin:0;white-space:nowrap}
.lb-week-row select{width:auto;min-width:120px}
.week-selector{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.week-selector select{width:auto;min-width:130px}
.week-selector label{margin:0;white-space:nowrap}
@media(max-width:700px){
  .home-layout{grid-template-columns:1fr}
  .sticky-col{position:static}
  .game-input-grid,.game-input-grid-bottom,.row2,.row3{grid-template-columns:1fr}
  .game-card-body{flex-wrap:wrap}
  .game-info-block{border-left:none;border-top:1px solid var(--border);width:100%;flex-direction:row;justify-content:space-between}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-badge"><span>CFB</span></div>
  <span class="topbar-title">College Football Pick Em</span>
</div>
<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('home',this)">Home</button>
    <button class="tab" onclick="showTab('admin',this)">Admin</button>
  </div>

  <!-- HOME -->
  <div class="section active" id="tab-home">
    <div class="home-layout">
      <!-- LEFT: Submit picks -->
      <div>
        <div class="card">
          <div class="card-title">Submit picks</div>

          <!-- Step 1: Name + PIN -->
          <div id="pick-login-area">
            <div class="row3" style="margin-bottom:.75rem">
              <div><label>Your name</label><select id="picker-name" onchange="resetPinState()"><option value="">— select your name —</option></select></div>
              <div><label>Your PIN</label><input type="password" id="picker-pin" maxlength="4" placeholder="••••" inputmode="numeric" onkeydown="if(event.key==='Enter')verifyPin()"></div>
              <div style="display:flex;align-items:flex-end"><button class="btn-primary" style="width:100%" onclick="verifyPin()">Verify</button></div>
            </div>
            <div id="pin-err" class="err" style="display:none"></div>
          </div>

          <!-- Step 2: Week select + games (shown after PIN verified) -->
          <div id="pick-content" style="display:none">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
              <div style="display:flex;align-items:center;gap:10px">
                <label style="margin:0">Week</label>
                <select id="picks-week" onchange="renderPicksGames()" style="width:auto;min-width:130px"></select>
              </div>
              <button class="btn-secondary btn-sm" onclick="signOut()">Sign out</button>
            </div>
            <div id="picks-games-list"><p class="empty">Loading...</p></div>
            <div id="picks-err" class="err" style="display:none"></div>
            <div id="picks-success" class="success-msg" style="display:none"></div>
            <button class="btn-primary" style="margin-top:1rem" onclick="submitPicks()">Save my picks</button>
          </div>
        </div>
      </div>

      <!-- RIGHT: Breakdown + Standings -->
      <div class="sticky-col">
        <div class="card">
          <div class="card-title">Weekly breakdown</div>
          <div class="lb-week-row">
            <label>Week</label>
            <select id="weekly-week" onchange="renderWeeklyBreakdown()"></select>
          </div>
          <div id="weekly-breakdown"></div>
        </div>
        <div class="card">
          <div class="section-header">
            <div class="card-title" style="margin:0;border:none;padding:0">Season standings</div>
            <span id="lb-week-badge" class="badge badge-neutral"></span>
          </div>
          <div id="leaderboard-list"><p class="empty">No picks submitted yet.</p></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ADMIN -->
  <div class="section" id="tab-admin">
    <div class="card" id="admin-gate">
      <div class="pw-gate">
        <p>Enter the admin password to continue.</p>
        <div class="pw-row">
          <input type="password" id="admin-pw" placeholder="Password" onkeydown="if(event.key==='Enter')checkAdminPw()">
          <button class="btn-primary" onclick="checkAdminPw()">Unlock</button>
        </div>
        <span class="pw-err" id="pw-err" style="display:none">Incorrect password.</span>
      </div>
    </div>
    <div id="admin-unlocked" class="admin-unlocked">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem">
          <div class="card-title" id="setup-week-title" style="margin:0;border:none;padding:0">Set up a week</div>
          <div style="display:flex;align-items:center;gap:8px">
            <label style="margin:0;white-space:nowrap">Edit existing</label>
            <select id="edit-week-select" onchange="loadWeekForEdit()" style="width:auto;min-width:120px">
              <option value="">— new week —</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div><label>Week number</label><input type="number" id="admin-week" min="1" max="20" value="1"></div>
          <div><label>Week label (optional)</label><input type="text" id="admin-week-label" placeholder="e.g. Week 1 – Sep 6"></div>
        </div>
        <div id="admin-games"></div>
        <button class="btn-secondary btn-sm" style="margin-top:4px" onclick="addGameCard()">+ Add game</button>
        <div style="margin-top:1rem;display:flex;gap:8px;align-items:center">
          <button class="btn-primary" onclick="saveWeek()">Save week</button>
          <span id="admin-msg" style="font-size:13px"></span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Enter results</div>
        <div class="week-selector">
          <label>Week</label>
          <select id="results-week" onchange="renderResultsForm()"></select>
        </div>
        <div id="results-form"></div>
        <div style="margin-top:1rem;display:flex;gap:8px;align-items:center">
          <button class="btn-primary" onclick="saveResults()">Save results</button>
          <button class="btn-danger" style="margin-left:4px" onclick="clearResults()">Clear results</button>
          <span id="results-msg" style="font-size:13px;color:var(--green)"></span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Stop submissions</div>
        <div class="week-selector">
          <label>Week</label>
          <select id="lock-week" onchange="renderLockStatus()"></select>
        </div>
        <div id="lock-status" style="margin-top:.75rem"></div>
      </div>
      <div class="card">
        <div class="card-title">Manage players</div>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:1rem">Each player gets a 4-digit PIN they use to access their picks.</p>
        <div class="row3" style="margin-bottom:12px">
          <div><label>Player name</label><input type="text" id="new-player" placeholder="e.g. Jake"></div>
          <div><label>4-digit PIN</label><input type="text" id="new-pin" placeholder="e.g. 1234" maxlength="4" inputmode="numeric"></div>
          <div style="display:flex;align-items:flex-end"><button class="btn-primary" style="width:100%" onclick="addPlayer()">Add</button></div>
        </div>
        <div id="players-list"></div>
      </div>
      <div style="text-align:right;margin-top:.5rem">
        <button class="btn-secondary btn-sm" onclick="lockAdmin()">Lock admin</button>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://xklviavmkmrslpypiztk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_uvK4LJNDQ_AmT_SGcONaQA_1GPpvMKs';
const ADMIN_PW = 'jake';

async function db(table, method='GET', body=null, query='', returnData=true){
  try{
    const headers={
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Accept': 'application/json',
    };
    if(method==='POST'){
      headers['Prefer']='resolution=merge-duplicates,return=representation';
    }
    if(method==='DELETE'){
      headers['Prefer']='return=representation';
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
      method, headers,
      body: body ? JSON.stringify(body) : null
    });
    const text = await res.text();
    if(!res.ok){
      console.error(`DB error [${method} ${table}${query}]:`, text);
      return {_error: true, _status: res.status, _msg: text};
    }
    return text ? JSON.parse(text) : [];
  } catch(e){
    console.error('DB fetch failed:', e);
    return {_error: true, _msg: e.message};
  }
}

let state = { players:[], weeks:{}, picks:{}, results:{} };
let adminUnlocked = sessionStorage.getItem('pickem_admin')==='1';
let pendingPicks = {};
let lastPickContext = '';
let gameCount = 0;
// Verified player session
let verifiedPlayer = sessionStorage.getItem('pickem_player') || '';

async function loadAll(){
  const [players, weeks, picks, results] = await Promise.all([
    db('players','GET',null,'?select=name,pin&order=name'),
    db('weeks','GET',null,'?select=*&order=week_number'),
    db('picks','GET',null,'?select=*'),
    db('results','GET',null,'?select=*')
  ]);
  // Store players with pins (for verification)
  const safeArr = v => Array.isArray(v) ? v : [];
  state.playerData = {};
  safeArr(players).forEach(p=>{ state.playerData[p.name]=p.pin; });
  state.players = safeArr(players).map(p=>p.name);
  state.weeks = {};
  safeArr(weeks).forEach(w=>{
    state.weeks[w.week_number] = { label:w.label, locked:w.locked, games:w.games||[] };
  });
  state.picks = {};
  safeArr(picks).forEach(p=>{
    if(!state.picks[p.week_number]) state.picks[p.week_number]={};
    if(!state.picks[p.week_number][p.player_name]) state.picks[p.week_number][p.player_name]={};
    state.picks[p.week_number][p.player_name][p.game_index]=p.pick;
  });
  state.results = {};
  safeArr(results).forEach(r=>{
    if(!state.results[r.week_number]) state.results[r.week_number]={};
    state.results[r.week_number][r.game_index]=r.winner;
  });
  populateWeekSelects();
  populatePlayerSelect();
  renderLeaderboard();
  renderWeeklyBreakdown();
  // Restore verified session
  if(verifiedPlayer && state.players.includes(verifiedPlayer)){
    showPickContent();
    renderPicksGames();
  }
  if(adminUnlocked){
    document.getElementById('admin-gate').style.display='none';
    document.getElementById('admin-unlocked').style.display='block';
    renderPlayersList();
  }
}

// PIN verification
function resetPinState(){
  document.getElementById('pin-err').style.display='none';
  const name = document.getElementById('picker-name').value;
  if(verifiedPlayer && name !== verifiedPlayer){
    signOut();
  }
}

async function verifyPin(){
  const name = document.getElementById('picker-name').value.trim().toLowerCase();
  const pin = document.getElementById('picker-pin').value.trim();
  const err = document.getElementById('pin-err');
  err.style.display='none';
  if(!name){ err.textContent='Select your name first.'; err.style.display='block'; return; }
  if(!pin || pin.length!==4 || !/^\d{4}$/.test(pin)){ err.textContent='Enter your 4-digit PIN.'; err.style.display='block'; return; }
  // Fetch directly from Supabase to always get the latest PIN
  err.textContent='Verifying...'; err.style.display='block'; err.style.color='var(--text-muted)';
  const result = await db('players','GET',null,`?name=eq.${encodeURIComponent(name)}&select=name,pin`);
  err.style.display='none';
  if(!result || result._error || result.length===0){
    err.textContent='Player not found. Ask the admin to add you.'; err.style.display='block'; err.style.color='var(--wrong)'; return;
  }
  const storedPin = result[0].pin;
  if(!storedPin){ err.textContent='No PIN set for this player. Ask the admin.'; err.style.display='block'; err.style.color='var(--wrong)'; return; }
  if(pin !== storedPin){ err.textContent='Incorrect PIN. Try again.'; err.style.display='block'; err.style.color='var(--wrong)'; document.getElementById('picker-pin').value=''; return; }
  // Verified
  verifiedPlayer = name;
  sessionStorage.setItem('pickem_player', name);
  showPickContent();
  renderPicksGames();
}

function showPickContent(){
  document.getElementById('pick-content').style.display='block';
  // Set the name dropdown to match verified player
  const sel = document.getElementById('picker-name');
  if(sel) sel.value = verifiedPlayer;
}

function signOut(clearPin=true){
  verifiedPlayer = '';
  sessionStorage.removeItem('pickem_player');
  pendingPicks = {};
  lastPickContext = '';
  document.getElementById('pick-content').style.display='none';
  if(clearPin) document.getElementById('picker-pin').value='';
  document.getElementById('pin-err').style.display='none';
  const err=document.getElementById('picks-err');
  const suc=document.getElementById('picks-success');
  if(err)err.style.display='none';
  if(suc)suc.style.display='none';
}

function checkAdminPw(){
  const val=document.getElementById('admin-pw').value;
  const err=document.getElementById('pw-err');
  if(val===ADMIN_PW){
    adminUnlocked=true; sessionStorage.setItem('pickem_admin','1');
    document.getElementById('admin-gate').style.display='none';
    document.getElementById('admin-unlocked').style.display='block';
    populateWeekSelects(); renderPlayersList(); renderResultsForm();
    err.style.display='none';
  } else { err.style.display='block'; document.getElementById('admin-pw').value=''; }
}
function lockAdmin(){
  adminUnlocked=false; sessionStorage.removeItem('pickem_admin');
  document.getElementById('admin-gate').style.display='block';
  document.getElementById('admin-unlocked').style.display='none';
  document.getElementById('admin-pw').value='';
}

function showTab(t,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='home'){ loadAll(); }
  if(t==='admin'){
    loadAll();
    if(adminUnlocked){
      document.getElementById('admin-gate').style.display='none';
      document.getElementById('admin-unlocked').style.display='block';
    } else {
      document.getElementById('admin-gate').style.display='block';
      document.getElementById('admin-unlocked').style.display='none';
    }
  }
}

function populateWeekSelects(){
  const wks=Object.keys(state.weeks).sort((a,b)=>+a-+b);
  ['picks-week','weekly-week','results-week','lock-week'].forEach(id=>{
    const el=document.getElementById(id); if(!el)return;
    const cur=el.value;
    el.innerHTML=wks.length?wks.map(w=>`<option value="${w}">${state.weeks[w].label||'Week '+w}</option>`).join(''):'<option value="">No weeks yet</option>';
    if(wks.includes(cur))el.value=cur; else if(wks.length)el.value=wks[wks.length-1];
  });
  const editSel=document.getElementById('edit-week-select');
  if(editSel){
    const curEdit=editSel.value;
    const wks2=Object.keys(state.weeks).sort((a,b)=>+a-+b);
    editSel.innerHTML='<option value="">— new week —</option>'+wks2.map(w=>`<option value="${w}">${state.weeks[w].label||'Week '+w}</option>`).join('');
    if(wks2.includes(curEdit))editSel.value=curEdit;
  }
  renderResultsForm();
  renderLockStatus();
}

function populatePlayerSelect(){
  const el=document.getElementById('picker-name'); if(!el)return;
  const cur=verifiedPlayer||el.value;
  el.innerHTML='<option value="">— select your name —</option>'+
    state.players.map(p=>`<option value="${p}">${p.charAt(0).toUpperCase()+p.slice(1)}</option>`).join('');
  if(state.players.includes(cur))el.value=cur;
}

// ADMIN game cards
function addGameCard(g){
  gameCount++;
  const div=document.createElement('div');
  div.className='game-input-card';
  const n=document.querySelectorAll('.game-input-card').length+1;
  div.innerHTML=`
    <div class="game-input-card-header">
      <span class="game-num">Game ${n}</span>
      <button class="btn-danger" onclick="this.closest('.game-input-card').remove();renumberGames()">Remove</button>
    </div>
    <div class="game-input-grid">
      <div><label>Away team</label><input type="text" class="g-away" placeholder="e.g. Michigan" value="${g?g.away:''}"></div>
      <div><label>Home team</label><input type="text" class="g-home" placeholder="e.g. Ohio State" value="${g?g.home:''}"></div>
    </div>
    <div class="game-input-grid-bottom">
      <div><label>Spread (favored team + number)</label><input type="text" class="g-spread" placeholder="e.g. Ohio State -7" value="${g?g.spread:''}"></div>
      <div><label>Day</label><select class="g-day">${['','Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<option value="${d}" ${g&&g.day===d?'selected':''}>${d||'—'}</option>`).join('')}</select></div>
      <div><label>Kickoff time</label><input type="text" class="g-time" placeholder="e.g. 3:30 PM ET" value="${g?g.time:''}"></div>
      <div><label>TV network</label><input type="text" class="g-tv" placeholder="e.g. ABC" value="${g?g.tv:''}"></div>
    </div>`;
  document.getElementById('admin-games').appendChild(div);
}
function renumberGames(){
  document.querySelectorAll('.game-input-card').forEach((c,i)=>c.querySelector('.game-num').textContent='Game '+(i+1));
}
function getAdminGames(){
  return [...document.querySelectorAll('.game-input-card')].map(c=>({
    away:c.querySelector('.g-away').value.trim(),
    home:c.querySelector('.g-home').value.trim(),
    spread:c.querySelector('.g-spread').value.trim(),
    time:c.querySelector('.g-time').value.trim(),
    tv:c.querySelector('.g-tv').value.trim(),
    day:c.querySelector('.g-day').value.trim()
  })).filter(g=>g.away&&g.home);
}
function loadWeekForEdit(){
  const wn=document.getElementById('edit-week-select').value;
  if(!wn||!state.weeks[wn])return;
  const w=state.weeks[wn];
  document.getElementById('admin-week').value=wn;
  document.getElementById('admin-week-label').value=w.label||'';
  document.getElementById('setup-week-title').textContent='Edit week';
  document.getElementById('admin-games').querySelectorAll('.game-input-card').forEach(c=>c.remove());
  gameCount=0;
  (w.games||[]).forEach(g=>addGameCard(g));
}
async function saveWeek(){
  const wn=document.getElementById('admin-week').value.trim();
  const lbl=document.getElementById('admin-week-label').value.trim();
  const msg=document.getElementById('admin-msg');
  if(!wn){msg.style.color='#dc2626';msg.textContent='Enter a week number.';return}
  const games=getAdminGames();
  if(!games.length){msg.style.color='#dc2626';msg.textContent='Add at least 1 game.';return}
  msg.style.color='#5566aa';msg.textContent='Saving...';
  const existing=state.weeks[wn]||{};
  const payload={week_number:+wn, label:lbl||'Week '+wn, locked:existing.locked||false, games};
  const res=await db('weeks','POST',payload,'?on_conflict=week_number');
  if(res){
    msg.style.color='#16a34a';msg.textContent='Week saved!';
    setTimeout(()=>msg.textContent='',2500);
    document.getElementById('setup-week-title').textContent='Set up a week';
    document.getElementById('edit-week-select').value='';
    await loadAll();
  } else { msg.style.color='#dc2626';msg.textContent='Error saving. Try again.'; }
}

function renderResultsForm(){
  const wn=document.getElementById('results-week')?.value;
  const form=document.getElementById('results-form');
  if(!form)return;
  if(!wn||!state.weeks[wn]){form.innerHTML='<p class="empty">No week selected.</p>';return}
  const games=state.weeks[wn].games||[];
  const res=state.results[wn]||{};
  form.innerHTML=games.map((g,i)=>{
    const meta=[g.day,g.time,g.tv].filter(Boolean).join(' · ');
    return`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;font-size:14px;font-weight:500">${g.away} @ ${g.home}${meta?`<div style="font-size:11px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.3px">${meta}</div>`:''}</div>
      <select id="res-${wn}-${i}" style="width:auto;min-width:150px">
        <option value="">— who covered? —</option>
        <option value="${g.away}" ${res[i]===g.away?'selected':''}>${g.away} covers</option>
        <option value="${g.home}" ${res[i]===g.home?'selected':''}>${g.home} covers</option>
      </select>
    </div>`;
  }).join('');
}
async function saveResults(){
  const wn=document.getElementById('results-week').value; if(!wn)return;
  const games=state.weeks[wn]?.games||[];
  const msg=document.getElementById('results-msg');
  msg.textContent='Saving...';msg.style.color='#5566aa';
  const inserts=[];
  games.forEach((_,i)=>{
    const v=document.getElementById(`res-${wn}-${i}`)?.value;
    if(v) inserts.push({week_number:+wn, game_index:i, winner:v});
  });
  if(!inserts.length){msg.style.color='#dc2626';msg.textContent='No results entered.';return}
  const res=await db('results','POST',inserts,'?on_conflict=week_number,game_index');
  if(res!==null){
    msg.style.color='#16a34a';msg.textContent='Results saved!';
    setTimeout(()=>msg.textContent='',2500);
    await loadAll();
  } else { msg.style.color='#dc2626';msg.textContent='Error saving.'; }
}

async function clearResults(){
  const wn=document.getElementById('results-week').value; if(!wn)return;
  const msg=document.getElementById('results-msg');
  if(!confirm(`Clear all results for ${state.weeks[wn]?.label||'Week '+wn}? This cannot be undone.`))return;
  msg.textContent='Clearing...';msg.style.color='#5566aa';
  const res=await db('results','DELETE',null,`?week_number=eq.${wn}`);
  if(!res?._error){
    msg.style.color='#16a34a';msg.textContent='Results cleared!';
    setTimeout(()=>msg.textContent='',2500);
    await loadAll();
    renderResultsForm();
  } else { msg.style.color='#dc2626';msg.textContent='Error clearing results.'; }
}

function renderLockStatus(){
  const wn=document.getElementById('lock-week')?.value;
  const el=document.getElementById('lock-status'); if(!el)return;
  if(!wn||!state.weeks[wn]){el.innerHTML='';return}
  const locked=state.weeks[wn].locked||false;
  el.innerHTML=`<div style="display:flex;align-items:center;gap:12px">
    <span style="font-size:14px;color:${locked?'#e05050':'#1db954'};font-weight:600">${locked?'Submissions are stopped':'Submissions are open'}</span>
    <button class="${locked?'btn-primary':'btn-danger'}" onclick="toggleLock('${wn}')">${locked?'Reopen submissions':'Stop submissions'}</button>
  </div>`;
}
async function toggleLock(wn){
  if(!state.weeks[wn])return;
  const newLocked=!state.weeks[wn].locked;
  const w=state.weeks[wn];
  await db('weeks','POST',{week_number:+wn,label:w.label,locked:newLocked,games:w.games},'?on_conflict=week_number');
  await loadAll();
}

function getSpreadLabels(g){
  let awayLabel=g.away,homeLabel=g.home;
  const spread=g.spread||'';
  if(spread){
    const numMatch=spread.match(/([+-]?\d+\.?\d*)\s*$/);
    if(numMatch){
      const val=parseFloat(numMatch[1]);
      const absVal=Math.abs(val);
      const sl=spread.toLowerCase();
      const awayIn=sl.indexOf(g.away.toLowerCase())!==-1;
      const homeIn=sl.indexOf(g.home.toLowerCase())!==-1;
      if(homeIn&&!awayIn){
        homeLabel=g.home+(val<0?' '+val:' +'+absVal);
        awayLabel=g.away+(val<0?' +'+absVal:' -'+absVal);
      } else if(awayIn&&!homeIn){
        awayLabel=g.away+(val<0?' '+val:' +'+absVal);
        homeLabel=g.home+(val<0?' +'+absVal:' -'+absVal);
      } else {
        homeLabel=g.home+(val<0?' '+val:' +'+absVal);
        awayLabel=g.away+(val<0?' +'+absVal:' -'+absVal);
      }
    }
  }
  return{awayLabel,homeLabel};
}

function renderPicksGames(){
  if(!verifiedPlayer){ document.getElementById('picks-games-list').innerHTML=''; return; }
  const wn=document.getElementById('picks-week')?.value;
  const list=document.getElementById('picks-games-list');
  if(!wn||!state.weeks[wn]){list.innerHTML='<p class="empty">No weeks set up yet.</p>';return}
  const games=state.weeks[wn].games||[];
  const name=verifiedPlayer;
  if(lastPickContext!==name+'|'+wn){lastPickContext=name+'|'+wn;pendingPicks={};}
  // Only load THIS player's picks
  const existing=(state.picks[wn]&&state.picks[wn][name])||{};
  const merged={...existing,...(pendingPicks[wn]||{})};
  const res=state.results[wn]||{};
  const hasResults=Object.keys(res).length>0;
  const isLocked=(state.weeks[wn].locked||false)||hasResults;
  list.innerHTML=games.map((g,i)=>{
    const pick=merged[i]||'';
    const result=res[i]||'';
    const{awayLabel,homeLabel}=getSpreadLabels(g);
    const meta=[g.day,g.time,g.tv].filter(Boolean).join(' · ');
    function btnClass(team){
      let c='pick-btn-row';
      if(pick===team)c+=' selected';
      if(result&&pick===team){c+=pick===result?' correct':' wrong'}
      return c;
    }
    return`<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;font-size:14px;font-weight:600;color:var(--text)">
        ${g.away} @ ${g.home}
        ${meta?`<div style="font-size:11px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.3px">${meta}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="${btnClass(g.away)}" onclick="selectPick(${i},'${g.away.replace(/'/g,"\\'")}',this)" ${isLocked?'disabled':''}>${awayLabel}</button>
        <button class="${btnClass(g.home)}" onclick="selectPick(${i},'${g.home.replace(/'/g,"\\'")}',this)" ${isLocked?'disabled':''}>${homeLabel}</button>
      </div>
    </div>`;
  }).join('');
  const suc=document.getElementById('picks-success');
  if(isLocked&&!hasResults){
    document.getElementById('picks-err').style.display='none';
    suc.style.display='block';suc.style.color='#e0a030';
    suc.textContent='Submissions are stopped for this week. Check back later.';
  } else if(hasResults){
    const score=Object.keys(res).filter(i=>merged[i]&&merged[i]===res[i]).length;
    suc.style.display='block';suc.style.color='#16a34a';
    suc.textContent=`Results are in — you went ${score}/${Object.keys(res).length} this week!`;
  } else {suc.style.display='none';}
}

function selectPick(idx,team,btn){
  const wn=document.getElementById('picks-week').value;
  if(!pendingPicks[wn])pendingPicks[wn]={};
  pendingPicks[wn][idx]=team;
  btn.closest('div').querySelectorAll('.pick-btn-row').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

async function submitPicks(){
  if(!verifiedPlayer){ return; }
  const name=verifiedPlayer;
  const wn=document.getElementById('picks-week').value;
  const err=document.getElementById('picks-err');
  const suc=document.getElementById('picks-success');
  err.style.display='none';suc.style.display='none';
  if(!wn){err.textContent='No week selected.';err.style.display='block';return}
  if(state.weeks[wn]?.locked){err.textContent='Submissions are stopped for this week.';err.style.display='block';return}
  const games=state.weeks[wn]?.games||[];
  const merged={...(state.picks[wn]?.[name]||{}),...(pendingPicks[wn]||{})};
  if(Object.keys(merged).length<games.length){err.textContent=`Pick all ${games.length} games first.`;err.style.display='block';return}
  suc.style.display='block';suc.style.color='#5566aa';suc.textContent='Saving...';
  const inserts=Object.entries(merged).map(([gi,pick])=>({
    player_name:name, week_number:+wn, game_index:+gi, pick
  }));
  const res=await db('picks','POST',inserts,'?on_conflict=player_name,week_number,game_index');
  if(res!==null){
    suc.textContent='Picks saved! Good luck 🏈';suc.style.color='#16a34a';
    pendingPicks={};
    await loadAll();
  } else { suc.style.display='none';err.textContent='Error saving picks. Try again.';err.style.display='block'; }
}

function renderLeaderboard(){
  const completedWeeks=Object.keys(state.weeks).filter(w=>Object.keys(state.results[w]||{}).length>0);
  const badge=document.getElementById('lb-week-badge');
  if(badge)badge.textContent=completedWeeks.length?`${completedWeeks.length} week${completedWeeks.length>1?'s':''} scored`:'No results yet';
  const players=[...new Set([...state.players,...Object.values(state.picks).flatMap(w=>Object.keys(w))])];
  const scores=players.map(p=>{
    let total=0,possible=0;
    completedWeeks.forEach(w=>{
      const res=state.results[w]||{};
      const picks=(state.picks[w]||{})[p]||{};
      Object.keys(res).forEach(i=>{possible++;if(picks[i]===res[i])total++});
    });
    return{name:p,total,possible};
  }).sort((a,b)=>b.total-a.total);
  const lb=document.getElementById('leaderboard-list');
  if(!lb)return;
  if(!scores.length){lb.innerHTML='<p class="empty">No picks yet.</p>';return}
  lb.innerHTML=scores.map((s,i)=>`
    <div class="leaderboard-row">
      <span class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span>
      <span class="lname">${s.name.charAt(0).toUpperCase()+s.name.slice(1)}</span>
      <span class="lscore">${s.total}</span>
      <span style="font-size:13px;color:var(--text-muted)">/ ${s.possible}</span>
    </div>`).join('');
}

function renderWeeklyBreakdown(){
  const wn=document.getElementById('weekly-week')?.value;
  const bd=document.getElementById('weekly-breakdown');if(!bd)return;
  if(!wn||!state.weeks[wn]){bd.innerHTML='<p class="empty">No data.</p>';return}
  const locked=state.weeks[wn].locked||false;
  const scored=Object.keys(state.results[wn]||{}).length>0;
  if(!locked&&!scored){
    bd.innerHTML='<p class="empty" style="text-align:center;padding:1.5rem 0">📋 Breakdown will be visible once submissions are stopped.</p>';
    return;
  }
  const games=state.weeks[wn].games||[];
  const res=state.results[wn]||{};
  const weekPicks=state.picks[wn]||{};
  const players=Object.keys(weekPicks).sort();
  if(!players.length){bd.innerHTML='<p class="empty">No picks this week.</p>';return}
  let html='<div style="overflow-x:auto"><table class="breakdown-table">';
  html+='<thead><tr><th style="text-align:left;padding-left:0">Player</th>';
  games.forEach((g,i)=>{
    const winner=res[i]||'';
    const awayStyle=scored&&winner===g.away?'color:#16a34a;font-weight:700':'';
    const homeStyle=scored&&winner===g.home?'color:#16a34a;font-weight:700':'';
    html+=`<th><span style="${awayStyle}">${g.away}</span><br><span style="color:#aaa;font-size:9px">@</span><br><span style="${homeStyle}">${g.home}</span></th>`;
  });
  if(scored) html+='<th>Score</th>';
  html+='</tr></thead><tbody>';
  players.forEach(p=>{
    const picks=weekPicks[p]||{};
    html+='<tr>';
    html+=`<td style="text-align:left;padding-left:0;font-weight:600;white-space:nowrap;color:var(--text)">${p.charAt(0).toUpperCase()+p.slice(1)}</td>`;
    games.forEach((g,i)=>{
      const pick=picks[i]||'';
      const result=res[i]||'';
      let cls='';
      if(scored&&result){
        if(!pick) cls='cell-none';
        else if(pick===result) cls='cell-correct';
        else cls='cell-wrong';
      }
      if(scored&&result){
        html+=`<td class="${cls}">${pick||'—'}</td>`;
      } else {
        html+=`<td style="color:${pick?'var(--text)':'var(--text-muted)'}">${pick||'—'}</td>`;
      }
    });
    if(scored){
      const total=Object.keys(res).filter(i=>picks[i]===res[i]).length;
      html+=`<td style="font-weight:700;color:${total>=3?'#16a34a':'#dc2626'}">${total}/${Object.keys(res).length}</td>`;
    }
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  bd.innerHTML=html;
}

async function addPlayer(){
  const n=document.getElementById('new-player').value.trim().toLowerCase();
  const pin=document.getElementById('new-pin').value.trim();
  const msg=document.getElementById('admin-msg');
  if(!n){msg.style.color='#dc2626';msg.textContent='Enter a player name.';return}
  if(!pin||pin.length!==4||!/^\d{4}$/.test(pin)){msg.style.color='#dc2626';msg.textContent='PIN must be exactly 4 digits.';return}
  msg.style.color='#5566aa';msg.textContent='Saving...';
  const res=await db('players','POST',{name:n,pin},'?on_conflict=name');
  if(res&&!res._error){
    document.getElementById('new-player').value='';
    document.getElementById('new-pin').value='';
    msg.style.color='#16a34a';msg.textContent='Player added!';
    setTimeout(()=>msg.textContent='',2500);
    await loadAll();
    renderPlayersList();
  } else {
    const detail=res?._msg||'Unknown error';
    msg.style.color='#dc2626';
    msg.textContent='Error: '+detail.substring(0,80);
    console.error('addPlayer error:', res);
  }
}
async function removePlayer(n){
  await db('players','DELETE',null,`?name=eq.${encodeURIComponent(n)}`);
  await loadAll();
  renderPlayersList();
}
function renderPlayersList(){
  const el=document.getElementById('players-list');if(!el)return;
  if(!state.players.length){el.innerHTML='<p class="empty">No players yet.</p>';return}
  el.innerHTML=state.players.map(p=>`
    <div class="leaderboard-row">
      <span class="lname">${p.charAt(0).toUpperCase()+p.slice(1)}</span>
      <span style="font-size:12px;color:var(--text-muted);margin-right:auto">PIN: ${state.playerData[p]||'—'}</span>
      <button class="btn-danger" onclick="removePlayer('${p}')">Remove</button>
    </div>`).join('');
}

// Init
for(let i=0;i<5;i++)addGameCard();
loadAll();
